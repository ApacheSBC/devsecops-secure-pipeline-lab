name: Secret Scanning (Gitleaks)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          # Scans the full git history (fetch-depth: 0 helps here)
          args: >
            detect
            --source .
            --redact
            --report-format sarif
            --report-path gitleaks.sarif

