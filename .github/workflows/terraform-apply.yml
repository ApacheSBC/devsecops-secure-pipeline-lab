name: Terraform - Apply (main)

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    # This requires you to create a GitHub Environment named "production"
    # and add required reviewers (manual approval).
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      # Apply is blocked by environment approval above.
      # This will still fail unless you provide cloud credentials later.
      - name: Terraform apply (placeholder until creds added)
        run: |
          echo "Apply is gated by environment approval."
          echo "Next step: add AWS credentials via OIDC (recommended) or repository secrets."
          echo "Skipping actual apply for now."

